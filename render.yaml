services:
  - type: web
    name: invoiceguard
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: false  # CI triggers the deploy hook after tests pass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_API_KEY
        sync: false
      # SAP_BASE_URL left unset: the app posts to its own /mock-sap on 127.0.0.1:$PORT
