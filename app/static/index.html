<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceGuard</title>
<meta name="description" content="AI accounts-payable agent: invoices in, verified decisions out.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"] {
  --bg: #0a0f1f; --bg-glow: rgba(124, 108, 255, .18);
  --card: rgba(22, 29, 54, .62); --card-solid: #131a33; --border: rgba(160, 175, 230, .16);
  --shadow: 0 10px 30px rgba(2, 6, 20, .45);
  --text: #e9edfa; --muted: #a3adc9; --faint: #6f7a9c;
  --accent: #8b7dff; --accent-strong: #6a5cf5; --accent-ink: #ffffff; --accent-soft: rgba(139, 125, 255, .14);
  --ok: #34d399; --ok-soft: rgba(52, 211, 153, .13);
  --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .13);
  --bad: #f87171; --bad-soft: rgba(248, 113, 113, .13);
  --track: rgba(160, 175, 230, .16);
  --input: rgba(8, 12, 28, .55);
}
:root[data-theme="light"] {
  --bg: #f3f5fc; --bg-glow: rgba(99, 85, 240, .12);
  --card: rgba(255, 255, 255, .78); --card-solid: #ffffff; --border: rgba(40, 52, 110, .14);
  --shadow: 0 10px 28px rgba(40, 52, 110, .12);
  --text: #12172b; --muted: #4c5573; --faint: #6b7493;
  --accent: #4f46e5; --accent-strong: #4338ca; --accent-ink: #ffffff; --accent-soft: rgba(79, 70, 229, .09);
  --ok: #047857; --ok-soft: rgba(4, 120, 87, .1);
  --warn: #92400e; --warn-soft: rgba(217, 119, 6, .13);
  --bad: #b91c1c; --bad-soft: rgba(185, 28, 28, .09);
  --track: rgba(40, 52, 110, .13);
  --input: rgba(255, 255, 255, .9);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
  background-image: radial-gradient(900px 480px at 50% -120px, var(--bg-glow), transparent 70%);
  background-repeat: no-repeat;
  font: 400 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; transition: background-color .25s, color .25s;
}
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
section { margin-top: 44px; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); padding: 22px;
  transition: border-color .2s, background-color .25s;
}
.btn {
  font: 600 14px/1 Inter, system-ui, sans-serif; border-radius: 10px; padding: 11px 16px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card-solid); color: var(--text);
  transition: transform .15s, background-color .2s, border-color .2s, opacity .2s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent-strong); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 8px 12px; font-size: 13px; }

/* header */
header.top { display: flex; align-items: center; gap: 14px; padding: 18px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; margin-right: auto; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); display: grid; place-items: center; color: #fff; }
.keybox { display: flex; align-items: center; gap: 8px; }
.keybox input {
  width: 190px; font: 400 13px "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--text);
  background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
  transition: border-color .2s, box-shadow .2s;
}
.keybox input.need { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.keybox input[aria-invalid="true"] { border-color: var(--bad); }
.iconbtn { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; border-radius: 10px; }

/* hero */
.hero { text-align: center; padding: 34px 0 6px; }
.hero h1 { font-size: clamp(32px, 6vw, 54px); line-height: 1.08; letter-spacing: -.03em; margin: 0; font-weight: 700; }
.hero h1 span { background: linear-gradient(120deg, var(--accent), #c4b5fd 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); font-size: clamp(16px, 2.4vw, 19px); margin: 14px auto 26px; max-width: 560px; }
.drop {
  max-width: 720px; margin: 0 auto; padding: 38px 20px; border: 2px dashed var(--border); border-radius: 20px; cursor: pointer;
  background: var(--card); transition: border-color .2s, background-color .2s, transform .2s;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.drop:hover { border-color: var(--accent); }
.drop.drag { border-color: var(--accent); background: var(--accent-soft); animation: pulse-border 1.1s ease-in-out infinite; }
.drop svg { color: var(--accent); }
.drop strong { font-size: 16px; }
.drop small { color: var(--muted); }
.drop.busy { opacity: .6; pointer-events: none; }
@keyframes pulse-border { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 10px var(--accent-soft); } }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stat { padding: 18px 20px; }
.stat .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.stat .l { color: var(--muted); font-size: 13px; }
.skel { border-radius: 8px; background: linear-gradient(90deg, var(--track), transparent 50%, var(--track)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* samples */
.samples { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.sample { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font: inherit; color: inherit; padding: 18px; }
.sample:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.sample:disabled { opacity: .55; cursor: not-allowed; }
.sample { transition: border-color .2s, transform .2s; }
.sample .t { font-weight: 600; }
.sample .c { color: var(--muted); font-size: 13px; }
.sample .f { color: var(--faint); font-size: 12px; margin-top: auto; }
.tag { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); }

/* stepper */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; }
.step { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 0 4px; }
.step:not(:last-child)::after { content: ""; position: absolute; top: 18px; left: calc(50% + 24px); right: calc(-50% + 24px); height: 2px; background: var(--track); transition: background-color .3s; }
.step.done:not(:last-child)::after { background: var(--ok); }
.node { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: var(--card-solid); border: 2px solid var(--track); color: var(--faint); transition: all .25s; }
.step.active .node { border-color: var(--accent); color: var(--accent); animation: glow 1.4s ease-in-out infinite; }
.step.done .node { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.step.failed .node { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.step.skipped .node { border-style: dashed; }
.step .lab { font-size: 13px; font-weight: 600; line-height: 1.3; }
.step .sub { font-size: 12px; color: var(--muted); min-height: 16px; }
.step.pending .lab { color: var(--muted); }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft), 0 0 8px 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 7px var(--accent-soft), 0 0 22px 2px var(--accent); } }
.pnote { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; min-height: 20px; }

/* result */
.banner { display: flex; align-items: center; gap: 22px; padding: 24px; border-radius: 18px; border: 1px solid; flex-wrap: wrap; }
.banner.ok { background: var(--ok-soft); border-color: var(--ok); } .banner.warn { background: var(--warn-soft); border-color: var(--warn); } .banner.bad { background: var(--bad-soft); border-color: var(--bad); }
.banner .txt { flex: 1; min-width: 220px; }
.banner h3 { margin: 0; font-size: clamp(20px, 3.4vw, 28px); letter-spacing: -.02em; }
.banner.ok h3 { color: var(--ok); } .banner.warn h3 { color: var(--warn); } .banner.bad h3 { color: var(--bad); }
.banner p { margin: 6px 0 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; flex-direction: column; padding: 8px 12px; border-radius: 12px; background: var(--card-solid); border: 1px solid var(--border); max-width: 100%; }
.chip b { font-size: 13px; } .chip span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.chip.warn b { color: var(--warn); } .chip.bad b { color: var(--bad); }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .trk { stroke: var(--track); } .ring .arc { transition: stroke-dashoffset .8s ease; }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 20px; line-height: 1; }
.ring .num small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 3px; letter-spacing: .06em; text-transform: uppercase; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.preview { padding: 12px; display: flex; flex-direction: column; min-height: 420px; }
.preview iframe, .preview img { width: 100%; flex: 1; min-height: 400px; border: 0; border-radius: 12px; background: #fff; object-fit: contain; }
.preview .none { margin: auto; color: var(--muted); }
.ftable { width: 100%; border-collapse: collapse; }
.ftable th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 9px 10px 9px 0; white-space: nowrap; vertical-align: top; }
.ftable td { padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
.ftable th { border-top: 1px solid var(--border); }
.ftable tr:first-child th, .ftable tr:first-child td { border-top: 0; }
.ftable td.val { overflow-wrap: anywhere; padding-right: 12px; }
.ftable td.cf { width: 112px; }
.ftable tr.low { background: var(--warn-soft); }
.ftable tr.low td.val { color: var(--warn); font-weight: 600; }
.bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--ok); transition: width .6s ease; }
.bar.low i { background: var(--warn); }
.cfl { font-size: 11px; color: var(--muted); margin-top: 3px; }
.ctitle { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.ctitle h3 { margin: 0; font-size: 15px; } .ctitle span { font-size: 12px; color: var(--muted); }
.items { margin-top: 16px; width: 100%; border-collapse: collapse; font-size: 13px; }
.items th, .items td { padding: 6px 8px 6px 0; text-align: right; border-top: 1px solid var(--border); } .items th:first-child, .items td:first-child { text-align: left; }
.items th { color: var(--muted); font-weight: 500; }
details.audit { margin-top: 16px; } details.audit summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.tl { list-style: none; margin: 14px 0 0; padding: 0 0 0 18px; border-left: 2px solid var(--track); display: flex; flex-direction: column; gap: 14px; }
.tl li { position: relative; } .tl li::before { content: ""; position: absolute; left: -24px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.tl .when { color: var(--muted); font-size: 12px; } .tl .why { color: var(--muted); font-size: 13px; margin: 2px 0 0; padding-left: 16px; }

/* review queue */
.rq { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.rcard { display: flex; flex-direction: column; gap: 10px; }
.rcard h3 { margin: 0; font-size: 16px; }
.rmeta { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.edit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.edit label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.edit label.wide { grid-column: 1 / -1; }
.edit input { font: 400 13px Inter, sans-serif; color: var(--text); background: var(--input); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.valres { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
.empty { text-align: center; color: var(--muted); padding: 34px 20px; }
.empty b { display: block; color: var(--text); margin-bottom: 4px; }

/* toasts */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 32px)); }
.toast { padding: 12px 14px; border-radius: 12px; background: var(--card-solid); border: 1px solid var(--border); border-left: 4px solid var(--accent); box-shadow: var(--shadow); font-size: 14px; animation: tin .2s ease-out; }
.toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

footer { margin: 64px 0 36px; text-align: center; color: var(--muted); font-size: 13px; display: flex; gap: 8px 18px; justify-content: center; flex-wrap: wrap; }
[hidden] { display: none !important; }

@media (max-width: 860px) { .stats { grid-template-columns: repeat(2, 1fr); } .split { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .stepper { flex-direction: column; gap: 0; }
  .step { flex-direction: row; text-align: left; gap: 14px; padding: 0 0 22px; align-items: flex-start; }
  .step:last-child { padding-bottom: 0; }
  .step:not(:last-child)::after { top: 38px; bottom: 2px; left: 17px; right: auto; width: 2px; height: auto; }
  .step .sub { min-height: 0; }
  .keybox { width: 100%; order: 3; } .keybox input { flex: 1; width: auto; }
}
@media (max-width: 480px) { .wrap { padding: 0 16px; } .card { padding: 16px; } .edit { grid-template-columns: 1fr; } .banner { padding: 18px; } .stat .v { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L15.5 10"/></svg></span>InvoiceGuard</div>
    <div class="keybox">
      <label class="sr" for="key">Demo API key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Enter demo key">
    </div>
    <button class="btn iconbtn" id="theme" type="button" aria-label="Switch to light theme"></button>
  </header>

  <main>
    <div class="hero">
      <h1>Invoice<span>Guard</span></h1>
      <p>Invoices in. Verified decisions out.</p>
      <div class="drop" id="drop" role="button" tabindex="0" aria-label="Upload an invoice: drop a file here or press Enter to browse">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        <strong>Drop an invoice here, or click to browse</strong>
        <small>PDF, PNG or JPG, up to 5 MB</small>
        <input id="file" type="file" accept="application/pdf,image/png,image/jpeg" hidden>
      </div>
    </div>

    <section aria-labelledby="h-stats">
      <h2 id="h-stats">Overview</h2>
      <div class="stats" id="stats"></div>
    </section>

    <section aria-labelledby="h-samples">
      <h2 id="h-samples">Try a sample</h2>
      <div class="samples" id="samples"></div>
    </section>

    <section aria-labelledby="h-pipe" id="pipe-sec">
      <h2 id="h-pipe">Live pipeline</h2>
      <div class="card">
        <ol class="stepper" id="stepper" aria-label="Processing stages"></ol>
        <p class="pnote" id="pnote" role="status"></p>
      </div>
      <div id="result" aria-live="polite"></div>
    </section>

    <section aria-labelledby="h-rev">
      <h2 id="h-rev">Review queue</h2>
      <div class="rq" id="rq"></div>
    </section>
    <section aria-labelledby="h-hist">
      <h2 id="h-hist">Audit log (all invoices)</h2>
      <div class="card"><ol class="tl" id="hist" style="margin-top:0"></ol></div>
    </section>
  </main>

  <footer>
    <span>Prototype on synthetic data</span>
    <a href="https://github.com/Vrajjj10/Invoice-Guard" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://github.com/Vrajjj10/Invoice-Guard#readme" target="_blank" rel="noopener noreferrer">README</a>
    <a href="/docs">API docs</a>
  </footer>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const MAX_BYTES = 5 * 1024 * 1024;
const STAGES = [
  ["upload", "Upload"], ["ocr", "Text extraction (OCR)"], ["ai", "AI extraction"],
  ["validation", "Validation"], ["decision", "Decision"], ["sap", "SAP"],
];
const SAMPLES = {
  "1_clean.pdf": { title: "Clean invoice", cap: "Everything checks out. Auto-approved and posted to SAP.", tag: ["ok", "Approve"] },
  "2_clean_cgst_sgst.pdf": { title: "Intra-state GST", cap: "Valid CGST and SGST split from a second vendor.", tag: ["ok", "Approve"] },
  "3_wrong_total.pdf": { title: "Wrong total", cap: "Grand total overstated by 500. Flagged for a human.", tag: ["warn", "Review"] },
  "4_duplicate_of_1.pdf": { title: "Duplicate", cap: "Same vendor, number and total as sample 1. Run that first.", tag: ["bad", "Reject"] },
  "5_not_invoice.pdf": { title: "Not an invoice", cap: "A bank-detail change letter. Rejected as a non-invoice.", tag: ["bad", "Reject"] },
};
const FIELDS = [
  ["vendor_name", "Vendor"], ["vendor_gstin", "Vendor GSTIN", "mono", "gstin:vendor"], ["buyer_gstin", "Buyer GSTIN", "mono", "gstin:buyer"],
  ["invoice_number", "Invoice no.", "mono"], ["invoice_date", "Date"], ["currency", "Currency"],
  ["subtotal", "Subtotal", "money", "totals"], ["cgst", "CGST", "money", "totals"], ["sgst", "SGST", "money", "totals"],
  ["igst", "IGST", "money", "totals"], ["grand_total", "Grand total", "money", "totals"],
];
const EDITABLE = [
  ["vendor_name", "Vendor", "text", true], ["vendor_gstin", "Vendor GSTIN", "text"], ["invoice_number", "Invoice no.", "text"],
  ["invoice_date", "Date (YYYY-MM-DD)", "text"], ["subtotal", "Subtotal", "number"], ["cgst", "CGST", "number"],
  ["sgst", "SGST", "number"], ["igst", "IGST", "number"], ["grand_total", "Grand total", "number"],
];
const LOW = 0.7;

/* ---------- helpers (server data only ever goes through textContent / text nodes) ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  for (const kid of kids) e.append(kid);
  return e;
}
const store = {
  get(s, k) { try { return s.getItem(k); } catch { return null; } },
  set(s, k, v) { try { s.setItem(k, v); } catch { /* storage unavailable */ } },
};

/* ---------- run a file through the pipeline ---------- */
let runToken = 0, currentUrl = null;
function setBusy(b) {
  $("drop").classList.toggle("busy", b);
  document.querySelectorAll(".sample").forEach((s) => { s.disabled = b; });
}
function validateFile(f) {
  if (f.size > MAX_BYTES) { toast("That file is too large. The limit is 5 MB.", "bad"); return false; }
  if (!["application/pdf", "image/png", "image/jpeg"].includes(f.type)) { toast("Unsupported file. Use a PDF, PNG or JPG.", "bad"); return false; }
  return true;
}
async function runFile(f) {
  if (!validateFile(f)) return;
  const token = ++runToken;
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(f);
  const file = { name: f.name, type: f.type, url: currentUrl };
  const extra = {};
  setBusy(true);
  renderStepper([{ key: "upload", status: "active" }], extra);
  renderResultSkeleton(file);
  $("pnote").textContent = "Uploading…";
  $("pipe-sec").scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
  const wakeTimer = setTimeout(() => { if (token === runToken) $("pnote").textContent = "Service is waking up, about a minute. Hang tight."; }, 6000);
  try {
    const fd = new FormData();
    fd.append("file", f, f.name);
    const t0 = performance.now();
    const up = await api("/invoices/upload", { method: "POST", body: fd });
    extra.uploadMs = performance.now() - t0;
    clearTimeout(wakeTimer);
    if (up.cached) toast("Same file seen before. Showing the cached result.");
    $("pnote").textContent = "Processing…";
    let job, errs = 0;
    for (let i = 0; i < 150; i++) {
      if (token !== runToken) return;
      try {
        job = await api(`/jobs/${up.job_id}`);
        errs = 0;
      } catch (e) {
        if (e.kind !== "wake" || ++errs > 40) throw e;
        $("pnote").textContent = "Service is waking up, about a minute. Still trying…";
        await sleep(3000);
        continue;
      }
      renderStepper(job.stages, extra);
      if (job.status === "done" || job.status === "failed") break;
      $("pnote").textContent = "Processing…";
      await sleep(1100);
    }
    if (!job || (job.status !== "done" && job.status !== "failed")) throw new ApiError("other", "Timed out waiting for the result.", 0);
    $("pnote").textContent = job.status === "done" ? "Finished." : "Failed.";
    await renderResult(job, file);
    if (job.status === "failed") toast("Processing failed. See the banner for details.", "bad");
    loadStats(false); loadReviews(); loadHistory();
  } catch (e) {
    clearTimeout(wakeTimer);
    $("pnote").textContent = e.message;
    $("result").replaceChildren();
    renderStepper([{ key: "upload", status: "failed" }], extra);
    handleError(e);
  } finally {
    if (token === runToken) setBusy(false);
  }
}

function init() {
  applyTheme(store.get(localStorage, "ig_theme") === "light" ? "light" : "dark");
  $("theme").addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(t); store.set(localStorage, "ig_theme", t);
  });
  const key = $("key");
  key.value = getKey();
  markKey(false);
  let debounce;
  key.addEventListener("input", () => {
    store.set(sessionStorage, "ig_key", key.value.trim());
    markKey(false);
    clearTimeout(debounce);
    debounce = setTimeout(() => { loadStats(true); loadReviews(); loadHistory(); }, 500);
  });
  const drop = $("drop"), input = $("file");
  const pick = () => input.click();
  drop.addEventListener("click", pick);
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  input.addEventListener("click", (e) => e.stopPropagation());
  input.addEventListener("change", () => { if (input.files[0]) runFile(input.files[0]); input.value = ""; });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) runFile(f); });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  renderStepper([], {});
  $("pnote").textContent = "Upload an invoice or try a sample to watch the pipeline run.";
  loadStats(true); loadSamples(); loadReviews(); loadHistory();
}
init();
</script>
</body>
</html>
